
          - entity: sensor.anwb_top_9
            name: '9️⃣ #9'
            color: '#2196F3'
            icon: mdi:numeric-9-circle
            icon_size: 28x28

          - entity: sensor.anwb_top_10
            name: '🔟 #10'
            color: '#00BCD4'
            icon: mdi:numeric-10-circle
            icon_size: 28x28

  # Titel sectie
  - type: grid
    columns: 1
    cards:
      - type: markdown
        content: |
          # ⚙️ Instellingen & Controle
        card_mod:
          style:
            ha-card:
              - background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'
              - color: white
              - padding: 20px
              - border-radius: 10px

  # Instellingen formulier
  - type: grid
    columns: 1
    cards:
      - type: vertical-stack
        cards:
          # Bestemming input
          - type: entities
            title: 📍 Bestemming
            entities:
              - entity: input_text.anwb_destination
                name: Waar wil je heen?
                icon: mdi:map-marker

          # Omrijafstand slider
          - type: entities
            title: 🛣️ Maximale omrijafstand
            entities:
              - entity: input_number.anwb_max_detour_km
                name: Hoeveel extra km accepteer je?
                icon: mdi:roads
                slider:
                  min: 1
                  max: 100
                  step: 1

          # Ladertype selector
          - type: entities
            title: ⚡ Ladertype
            entities:
              - entity: input_select.anwb_charger_type
                name: Welk type laadpaal?
                icon: mdi:ev-station

  # Update knop
  - type: grid
    columns: 1
    cards:
      - type: custom:button-card
        entity: sensor.anwb_charger_count
        name: 🔍 Laadpalen & Brandstof zoeken
        icon: mdi:refresh
        show_entity_picture: false
        show_state: true
        show_name: true
        show_icon: true
        size: 30%
        tap_action:
          action: call-service
          service: homeassistant.update_entity
          service_data:
            entity_id:
              - sensor.anwb_cheapest_charger
              - sensor.anwb_charger_count
              - sensor.anwb_cheapest_fuel
              - sensor.anwb_fuel_count
              - sensor.anwb_top_1
              - sensor.anwb_top_2
              - sensor.anwb_top_3
              - sensor.anwb_top_4
              - sensor.anwb_top_5
              - sensor.anwb_top_6
              - sensor.anwb_top_7
              - sensor.anwb_top_8
              - sensor.anwb_top_9
              - sensor.anwb_top_10
              - sensor.anwb_top_fuel_1
              - sensor.anwb_top_fuel_2
              - sensor.anwb_top_fuel_3
              - sensor.anwb_top_fuel_4
              - sensor.anwb_top_fuel_5
              - sensor.anwb_top_fuel_6
              - sensor.anwb_top_fuel_7
              - sensor.anwb_top_fuel_8
              - sensor.anwb_top_fuel_9
