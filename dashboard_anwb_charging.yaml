title: ANWB Laadpalen
path: anwb-charging
icon: mdi:ev-station

sections:
  # Kaart met laadpalen
  - type: grid
    columns: 1
    cards:
      - type: custom:map
        default_zoom: 10
        center_latitude: 52.1326
        center_longitude: 5.2913
        entities:
          # Device tracker als blauwe marker
          - entity: device_tracker.mijn_positie
            name: Mijn Positie
            color: '#2196F3'
            icon: mdi:car
            icon_size: 32x32
            
          # Laadpalen met nummers 1-10
          - entity: sensor.anwb_top_1
            name: '1️⃣ #1 Goedkoopste'
            color: '#4CAF50'
            icon: mdi:numeric-1-circle
            icon_size: 28x28

          - entity: sensor.anwb_top_2
            name: '2️⃣ #2'
            color: '#FFC107'
            icon: mdi:numeric-2-circle
            icon_size: 28x28

          - entity: sensor.anwb_top_3
            name: '3️⃣ #3'
            color: '#FF9800'
            icon: mdi:numeric-3-circle
            icon_size: 28x28

          - entity: sensor.anwb_top_4
            name: '4️⃣ #4'
            color: '#F44336'
            icon: mdi:numeric-4-circle
            icon_size: 28x28

          - entity: sensor.anwb_top_5
            name: '5️⃣ #5'
            color: '#E91E63'
            icon: mdi:numeric-5-circle
            icon_size: 28x28

          - entity: sensor.anwb_top_6
            name: '6️⃣ #6'
            color: '#9C27B0'
            icon: mdi:numeric-6-circle
            icon_size: 28x28

          - entity: sensor.anwb_top_7
            name: '7️⃣ #7'
            color: '#673AB7'
            icon: mdi:numeric-7-circle
            icon_size: 28x28

          - entity: sensor.anwb_top_8
            name: '8️⃣ #8'
            color: '#3F51B5'
            icon: mdi:numeric-8-circle
            icon_size: 28x28

          - entity: sensor.anwb_top_9
            name: '9️⃣ #9'
            color: '#2196F3'
            icon: mdi:numeric-9-circle
            icon_size: 28x28

          - entity: sensor.anwb_top_10
            name: '🔟 #10'
            color: '#00BCD4'
            icon: mdi:numeric-10-circle
            icon_size: 28x28

  # Titel sectie
  - type: grid
    columns: 1
    cards:
      - type: markdown
        content: |
          # ⚙️ Instellingen & Controle
        card_mod:
          style:
            ha-card:
              - background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'
              - color: white
              - padding: 20px
              - border-radius: 10px

  # Instellingen formulier
  - type: grid
    columns: 1
    cards:
      - type: vertical-stack
        cards:
          # Bestemming input
          - type: entities
            title: 📍 Bestemming
            entities:
              - entity: input_text.anwb_destination
                name: Waar wil je heen?
                icon: mdi:map-marker

          # Omrijafstand slider
          - type: entities
            title: 🛣️ Maximale omrijafstand
            entities:
              - entity: input_number.anwb_max_detour_km
                name: Hoeveel extra km accepteer je?
                icon: mdi:roads
                slider:
                  min: 1
                  max: 100
                  step: 1

          # Ladertype selector
          - type: entities
            title: ⚡ Ladertype
            entities:
              - entity: input_select.anwb_charger_type
                name: Welk type laadpaal?
                icon: mdi:ev-station

  # Update knop
  - type: grid
    columns: 1
    cards:
      - type: custom:button-card
        entity: sensor.anwb_charger_count
        name: 🔍 Laadpalen zoeken
        icon: mdi:refresh
        show_entity_picture: false
        show_state: true
        show_name: true
        show_icon: true
        size: 30%
        tap_action:
          action: call-service
          service: homeassistant.update_entity
          service_data:
            entity_id:
              - sensor.anwb_cheapest_charger
              - sensor.anwb_charger_count
              - sensor.anwb_top_1
              - sensor.anwb_top_2
              - sensor.anwb_top_3
              - sensor.anwb_top_4
              - sensor.anwb_top_5
              - sensor.anwb_top_6
              - sensor.anwb_top_7
              - sensor.anwb_top_8
              - sensor.anwb_top_9
              - sensor.anwb_top_10
        styles:
          card:
            - background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'
            - padding: 30px 20px
            - border-radius: 10px
            - box-shadow: '0 4px 15px rgba(0, 0, 0, 0.2)'
            - transition: all 0.3s ease
          name:
            - font-size: 20px
            - font-weight: bold
            - color: white
          icon:
            - color: white
            - width: 40px
            - height: 40px
          state:
            - font-size: 16px
            - color: rgba(255, 255, 255, 0.9)
            - margin-top: 10px

  # Resultaten Info
  - type: grid
    columns: 2
    cards:
      - type: markdown
        content: |
          ### 📊 Totaal Beschikbaar
          
          `{{ states('sensor.anwb_charger_count') }}`
          
          laadpalen
        card_mod:
          style:
            ha-card:
              - background-color: 'rgba(100, 150, 255, 0.1)'
              - border-left: 4px solid #2196F3
              - padding: 16px

      - type: markdown
        content: |
          ### 💶 Goedkoopste
          
          `{{ state_attr('sensor.anwb_cheapest_charger', 'price_per_kwh') }} €/kWh`
          
          {{ states('sensor.anwb_cheapest_charger') }}
        card_mod:
          style:
            ha-card:
              - background-color: 'rgba(76, 175, 80, 0.1)'
              - border-left: 4px solid #4CAF50
              - padding: 16px

  # Laadpalen TOP 3
  - type: grid
    columns: 1
    cards:
      - type: markdown
        content: |
          # 🏆 Top 3 Goedkoopste Laadpalen
        card_mod:
          style:
            ha-card:
              - background: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)'
              - color: white
              - padding: 20px
              - border-radius: 10px
              - margin-bottom: 0px

  - type: grid
    columns: 3
    cards:
      # #1
      - type: custom:button-card
        entity: sensor.anwb_top_1
        name: '🏆 #1'
        show_state: false
        show_entity_picture: false
        show_icon: false
        tap_action:
          action: url
          url_path: |
            [[[
              const entity = hass.states['sensor.anwb_top_1'];
              if (entity && entity.attributes.latitude && entity.attributes.longitude) {
                return "https://www.google.com/maps/dir/?api=1&destination=" + 
                       entity.attributes.latitude + "," + entity.attributes.longitude;
              }
              return "https://maps.google.com";
            ]]]
        styles:
          card:
            - background: 'linear-gradient(135deg, #4CAF50 0%, #388E3C 100%)'
            - padding: 20px
            - border-radius: 10px
          custom_fields:
            title:
              - font-size: 18px
              - font-weight: bold
              - color: white
            price:
              - font-size: 24px
              - font-weight: bold
              - color: white
            location:
              - font-size: 14px
              - color: rgba(255, 255, 255, 0.9)
            power:
              - font-size: 14px
              - color: rgba(255, 255, 255, 0.8)
        custom_fields:
          title: |
            [[[
              const entity = hass.states['sensor.anwb_top_1'];
              return entity ? entity.state : 'N/A';
            ]]]
          price: |
            [[[
              const entity = hass.states['sensor.anwb_top_1'];
              return entity && entity.attributes.price_per_kwh ? 
                     '€' + parseFloat(entity.attributes.price_per_kwh).toFixed(4) + '/kWh' : 'N/A';
            ]]]
          location: |
            [[[
              const entity = hass.states['sensor.anwb_top_1'];
              return entity && entity.attributes.city ? 
                     entity.attributes.postal_code + ' ' + entity.attributes.city : '';
            ]]]
          power: |
            [[[
              const entity = hass.states['sensor.anwb_top_1'];
              return entity && entity.attributes.max_power_kw ? 
                     '⚡ ' + entity.attributes.max_power_kw + ' kW' : '';
            ]]]

      # #2
      - type: custom:button-card
        entity: sensor.anwb_top_2
        name: '#2'
        show_state: false
        show_entity_picture: false
        show_icon: false
        tap_action:
          action: url
          url_path: |
            [[[
              const entity = hass.states['sensor.anwb_top_2'];
              if (entity && entity.attributes.latitude && entity.attributes.longitude) {
                return "https://www.google.com/maps/dir/?api=1&destination=" + 
                       entity.attributes.latitude + "," + entity.attributes.longitude;
              }
              return "https://maps.google.com";
            ]]]
        styles:
          card:
            - background: 'linear-gradient(135deg, #FFC107 0%, #FFA000 100%)'
            - padding: 20px
            - border-radius: 10px
          custom_fields:
            title:
              - font-size: 18px
              - font-weight: bold
              - color: white
            price:
              - font-size: 24px
              - font-weight: bold
              - color: white
            location:
              - font-size: 14px
              - color: rgba(255, 255, 255, 0.9)
            power:
              - font-size: 14px
              - color: rgba(255, 255, 255, 0.8)
        custom_fields:
          title: |
            [[[
              const entity = hass.states['sensor.anwb_top_2'];
              return entity ? entity.state : 'N/A';
            ]]]
          price: |
            [[[
              const entity = hass.states['sensor.anwb_top_2'];
              return entity && entity.attributes.price_per_kwh ? 
                     '€' + parseFloat(entity.attributes.price_per_kwh).toFixed(4) + '/kWh' : 'N/A';
            ]]]
          location: |
            [[[
              const entity = hass.states['sensor.anwb_top_2'];
              return entity && entity.attributes.city ? 
                     entity.attributes.postal_code + ' ' + entity.attributes.city : '';
            ]]]
          power: |
            [[[
              const entity = hass.states['sensor.anwb_top_2'];
              return entity && entity.attributes.max_power_kw ? 
                     '⚡ ' + entity.attributes.max_power_kw + ' kW' : '';
            ]]]

      # #3
      - type: custom:button-card
        entity: sensor.anwb_top_3
        name: '#3'
        show_state: false
        show_entity_picture: false
        show_icon: false
        tap_action:
          action: url
          url_path: |
            [[[
              const entity = hass.states['sensor.anwb_top_3'];
              if (entity && entity.attributes.latitude && entity.attributes.longitude) {
                return "https://www.google.com/maps/dir/?api=1&destination=" + 
                       entity.attributes.latitude + "," + entity.attributes.longitude;
              }
              return "https://maps.google.com";
            ]]]
        styles:
          card:
            - background: 'linear-gradient(135deg, #FF9800 0%, #F57C00 100%)'
            - padding: 20px
            - border-radius: 10px
          custom_fields:
            title:
              - font-size: 18px
              - font-weight: bold
              - color: white
            price:
              - font-size: 24px
              - font-weight: bold
              - color: white
            location:
              - font-size: 14px
              - color: rgba(255, 255, 255, 0.9)
            power:
              - font-size: 14px
              - color: rgba(255, 255, 255, 0.8)
        custom_fields:
          title: |
            [[[
              const entity = hass.states['sensor.anwb_top_3'];
              return entity ? entity.state : 'N/A';
            ]]]
          price: |
            [[[
              const entity = hass.states['sensor.anwb_top_3'];
              return entity && entity.attributes.price_per_kwh ? 
                     '€' + parseFloat(entity.attributes.price_per_kwh).toFixed(4) + '/kWh' : 'N/A';
            ]]]
          location: |
            [[[
              const entity = hass.states['sensor.anwb_top_3'];
              return entity && entity.attributes.city ? 
                     entity.attributes.postal_code + ' ' + entity.attributes.city : '';
            ]]]
          power: |
            [[[
              const entity = hass.states['sensor.anwb_top_3'];
              return entity && entity.attributes.max_power_kw ? 
                     '⚡ ' + entity.attributes.max_power_kw + ' kW' : '';
            ]]]

  # Laadpalen compleet lijst
  - type: grid
    columns: 1
    cards:
      - type: markdown
        content: |
          # 📋 Alle beschikbare laadpalen (Top 10)
        card_mod:
          style:
            ha-card:
              - background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'
              - color: white
              - padding: 20px
              - border-radius: 10px
              - margin-bottom: 0px

  - type: grid
    columns: 1
    cards:
      - type: custom:auto-entities
        card:
          type: vertical-stack
        card_param: cards
        filter:
          include:
            - options:
                type: custom:button-card
                show_icon: true
                show_name: false
                show_state: false
                tap_action:
                  action: url
                  url_path: |
                    [[[
                      const attrs = entity.attributes;
                      if (attrs && attrs.latitude && attrs.longitude) {
                        return "https://www.google.com/maps/dir/?api=1&destination="
                          + attrs.latitude + "," + attrs.longitude;
                      }
                      return "https://maps.google.com";
                    ]]]
                icon: |
                  [[[
                    const avail = entity.attributes?.charge_points_available || 0;
                    const total = entity.attributes?.charge_points_total || 1;
                    
                    if (avail === total) {
                      return "mdi:ev-station";
                    }
                    if (avail > 0) {
                      return "mdi:lightning-bolt";
                    }
                    return "mdi:ev-plug-tesla";
                  ]]]
                styles:
                  grid:
                    - grid-template-areas: |
                        "i name price"
                        "i address price"
                        "i details power"
                        "i detour session"
                    - grid-template-columns: 40px 1fr auto
                    - grid-template-rows: min-content min-content min-content min-content
                  card:
                    - padding: 12px
                    - background-color: |
                      [[[
                        const detour = entity.attributes?.detour_km || 0;
                        if (detour < 5) {
                          return 'rgba(76, 175, 80, 0.1)';
                        }
                        if (detour < 10) {
                          return 'rgba(255, 193, 7, 0.1)';
                        }
                        return 'rgba(244, 67, 54, 0.1)';
                      ]]]
                    - border-left: 4px solid |
                      [[[
                        const detour = entity.attributes?.detour_km || 0;
                        if (detour < 5) {
                          return '#4CAF50';
                        }
                        if (detour < 10) {
                          return '#FFC107';
                        }
                        return '#F44336';
                      ]]]
                  img_cell:
                    - align-self: start
                  icon:
                    - width: 28px
                    - height: 28px
                    - color: |
                      [[[
                        const avail = entity.attributes?.charge_points_available || 0;
                        const total = entity.attributes?.charge_points_total || 1;
                        
                        if (avail === total) {
                          return "#4CAF50";
                        }
                        if (avail > 0) {
                          return "#FFC107";
                        }
                        return "#F44336";
                      ]]]
                  custom_fields:
                    name:
                      - font-size: 16px
                      - font-weight: bold
                      - text-align: left
                      - justify-self: start
                      - width: 100%
                    address:
                      - font-size: 13px
                      - color: var(--secondary-text-color)
                      - text-align: left
                    details:
                      - font-size: 13px
                      - text-align: left
                    power:
                      - font-size: 13px
                      - font-weight: bold
                      - justify-self: end
                    detour:
                      - font-size: 12px
                      - color: var(--secondary-text-color)
                      - text-align: left
                      - justify-self: start
                    session:
                      - font-size: 12px
                      - color: var(--secondary-text-color)
                      - text-align: left
                      - justify-self: start
                      - width: 100%
                    price:
                      - font-size: 18px
                      - font-weight: bold
                      - color: '#00C853'
                      - justify-self: end
                custom_fields:
                  name: |
                    [[[
                      return entity.state || 'N/A';
                    ]]]
                  address: |
                    [[[
                      const attrs = entity.attributes;
                      if (attrs?.street) {
                        return (attrs.street || '') + "<br>" + 
                               (attrs.postal_code || '') + " " + 
                               (attrs.city || '');
                      }
                      return 'N/A';
                    ]]]
                  details: |
                    [[[
                      const avail = entity.attributes?.charge_points_available || 0;
                      const total = entity.attributes?.charge_points_total || 0;
                      return avail + "/" + total + " vrij";
                    ]]]
                  power: |
                    [[[
                      const power = entity.attributes?.max_power_kw || 'N/A';
                      return "⚡" + power + " kW";
                    ]]]
                  detour: |
                    [[[
                      const detour = entity.attributes?.detour_km;
                      if (detour === null || detour === undefined) {
                        return "📍 Info";
                      }
                      if (detour === 0) {
                        return "✅ Op route";
                      }
                      return "📍 +" + parseFloat(detour).toFixed(1) + " km";
                    ]]]
                  session: |
                    [[[
                      const price = entity.attributes?.session_price || 0;
                      return "€" + parseFloat(price).toFixed(2) + "/s";
                    ]]]
                  price: |
                    [[[
                      const price = entity.attributes?.price_per_kwh || 'N/A';
                      if (price === 'N/A') return price;
                      return "€" + parseFloat(price).toFixed(4) + "/kWh";
                    ]]]
              entity_id: sensor.anwb_top_*
          exclude:
            - state: Geen laadpaal
          sort:
            method: attribute
            attribute: rank
            numeric: true
